name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true        # bez tego brakuje Unity i build pada

      - name: Analiza statyczna
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck valgrind
          cppcheck --error-exitcode=1 --enable=warning,style \
                   --inline-suppr -Iinclude src/

      - name: Build i testy jednostkowe
        run: make test

      - name: Testy pod Valgrindem
        run: valgrind --leak-check=full --error-exitcode=1 ./build/test_runner